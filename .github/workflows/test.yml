name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa numpy pillow
      - run: python tools/test_addon.py
      - run: python tools/test_runs.py
      - run: python tools/test_editor.py
      # the data checks that need no game art (the others read refs/, which is not in the repository)
      - run: python tools/check_quest_marks.py
      - run: python tools/check_boss_marks.py
      - run: python tools/check_map_names.py
      - run: python tools/package.py
